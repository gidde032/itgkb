name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Gate the deploy so a red master build can never reach Pages. CI runs the
      # same gates on the push, but CI and deploy trigger in parallel — running
      # gates:quality here makes the deploy authoritative for its own artifact.
      # The Pages build (GITHUB_PAGES=true) then runs separately because it
      # needs the /itgkb/ base path, distinct from the dev build.
      - name: Quality gates (format, typecheck, lint, test+coverage, content)
        run: npm run gates:quality
      - name: Build (Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
